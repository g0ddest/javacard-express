name: Release

on:
  release:
    types: [ created ]

jobs:
  # Gate: the tag must be a version, and the full build (all tests, including the container tests on Docker, plus
  # javadoc and source jars) must pass before anything is published. Maven Central does not allow deleting a version
  # (a malformed tag once published '.0.1.1').
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-qualifier]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: oracle
          cache: maven
      - name: Build server JAR for container tests
        run: cd docker && ../mvnw package -B -q -Drevision=${{ steps.version.outputs.version }}
      - name: Full build with all tests, javadoc and sources
        run: ./mvnw clean verify -Prelease -Dgpg.skip -B -Drevision=${{ steps.version.outputs.version }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: oracle
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # The version comes from -Drevision (flatten-maven-plugin writes it into the published POMs); jar entries get
      # the tagged commit's time, so the artifacts are reproducible.
      - name: Build and deploy to Maven Central
        run: >-
          ./mvnw clean deploy -Prelease -B -DskipTests
          -Drevision=${{ needs.verify.outputs.version }}
          -Dproject.build.outputTimestamp=$(git log -1 --format=%cI)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Image version
        id: image
        run: echo "version=${{ needs.verify.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Build the simulator image locally first and check that it really serves sessions before anything is pushed
      # (every image published up to 0.3.0 was empty: its COPY wildcard matched no file).
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          build-args: JCX_VERSION=${{ steps.image.outputs.version }}
          tags: jcx-simulator:smoke-test

      - name: Smoke-test Docker image
        run: |
          docker run -d --name jcx-smoke -p 127.0.0.1:9876:9876 jcx-simulator:smoke-test
          test "$(docker inspect -f '{{.Config.User}}' jcx-smoke)" = "65534:65534"
          python3 - <<'PY' || { docker logs jcx-smoke; exit 1; }
          import socket, sys, time
          # PING frame [cmd 05][length 0]; expected reply [status 00][length 1][01]
          for attempt in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 9876), timeout=5) as s:
                      s.sendall(bytes([5, 0, 0, 0, 0]))
                      reply = b""
                      while len(reply) < 6:
                          chunk = s.recv(6 - len(reply))
                          if not chunk:
                              break
                          reply += chunk
                      if reply == bytes([0, 0, 0, 0, 1, 1]):
                          print("simulator answered PING")
                          sys.exit(0)
              except OSError as e:
                  print("waiting for the simulator:", e)
              time.sleep(1)
          sys.exit("the simulator image did not answer PING")
          PY
          docker logs jcx-smoke
          docker rm -f jcx-smoke

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          build-args: JCX_VERSION=${{ steps.image.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jcx-simulator:${{ steps.image.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jcx-simulator:latest

