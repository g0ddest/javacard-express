# What the project configures wins: its release, its core dependency and its annotation processor path stay, and the
# extension adds the rest. 1: the applet package builds and tests (the host package next to it is not checked);
# 2: the javac check, behind the project's own processor path, checks the package named on the command line.
invoker.debug = true
invoker.goals.1 = package -Djavacard.packageName=com.example.hello
invoker.goals.2 = clean compile -Djavacard.packageName=com.example.host
invoker.buildResult.2 = failure
