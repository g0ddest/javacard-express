# An applet that uses the GlobalPlatform Card API (org.globalplatform) in a project with nothing but the parent and a
# package AID: `mvn package` compiles it against the stubs, converts it with the built-in linking data and runs its
# test on jCardSim; then the same test class on the simulated GlobalPlatform card, where the secure channel the
# test opens through the applet passes the APDU guard.
invoker.goals.1 = package
invoker.goals.2 = verify -Djcx.backend=simulated-gp
